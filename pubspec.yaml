name: edrmp
description: "Electronic Device Registration & Monitoring Portal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.2
  flutter_riverpod: ^2.6.1
  google_maps_flutter: ^2.6.1
  shimmer: ^3.0.0
  supabase_flutter: ^2.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  connectivity_plus: ^6.1.0
  sentry_flutter: ^8.10.1
  image_picker: ^1.1.2
  intl: any
  flutter_local_notifications: ^21.0.0
  flutter_dotenv: ^5.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
